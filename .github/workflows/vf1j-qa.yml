name: VF-1J verification tools

on:
  push:
    branches:
      - "vf1j-reference-qa-*"
    paths:
      - "qa/**"
      - "blender/**"
      - ".github/workflows/vf1j-qa.yml"
  pull_request:
    paths:
      - "qa/**"
      - "blender/**"
      - ".github/workflows/vf1j-qa.yml"
  workflow_dispatch:

jobs:
  qa-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline visual-check dependencies
        run: python -m pip install -r qa/requirements.txt
      - name: Unit test mask metrics
        run: python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Syntax check Blender background runner
        run: python -m py_compile qa/render_views.py qa/project_reference_N3.py qa/project_side_N3.py blender/rebuild_N2.py blender/rebuild_N3.py blender/rebuild_N4.py
