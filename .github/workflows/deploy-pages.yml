name: Deploy Valkyrie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish existing static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site files
        run: |
          test -f dist/index.html
          test -f dist/viewer.js
          test -f dist/assets/vf1-valkyrie.glb
          test -f dist/portable-files.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site from dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
